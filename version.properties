# Nguồn duy nhất cho số hiệu phiên bản của app.
#
# versionName : chuỗi hiển thị cho người dùng, PHẢI khớp tag GitHub (v2.1 -> 2.1).
#
# versionCode : Android dùng số này để so sánh khi cập nhật, BẮT BUỘC tăng mỗi
#               lần phát hành. Quy ước: major*10000 + minor*100 + patch.
#               Phải khớp với UpdateChecker.parseVersionCode() và tag GitHub,
#               nếu không app sẽ không nhận ra bản mới.
#                  2.1   -> 20100
#                  2.2   -> 20200
#                  3.0   -> 30000
#                  2.1.3 -> 20103
#
# Sau khi sửa file này, build bằng:
#     gradlew.bat assembleRelease
# Hoặc dùng script tự động hoá (tự tính cả hai số):
#     powershell -File tools\release.ps1 -Bump

versionCode=20100
versionName=2.1
