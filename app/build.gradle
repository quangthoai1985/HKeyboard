import com.android.build.api.artifact.ArtifactTransformationRequest
import com.android.build.api.artifact.SingleArtifact

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'com.android.application'
}

// =====================================================================
// So hieu phien ban: doc tu version.properties o goc du an (nguon duy nhat).
// =====================================================================
def versionProps = new Properties()
def versionFile = rootProject.file('version.properties')
if (versionFile.exists()) {
    versionFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty('versionCode') ?: '1') as int
def appVersionName = versionProps.getProperty('versionName') ?: '1.0'

// =====================================================================
// Thong tin ky ban release: doc tu keystore.properties (KHONG commit file nay).
// Neu khong co file thi roi ve chu ky debug de van build duoc.
// =====================================================================
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseKeystore = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

// =====================================================================
// Repo GitHub dung cho tinh nang tu cap nhat.
// Co the ghi de khi build:  -PgithubRepo=owner/name
// =====================================================================
def githubRepo = (project.findProperty('githubRepo') ?: 'quangthoai1985/HKeyboard')
def githubRepoParts = githubRepo.split('/')

android {
    namespace = 'com.hkeyboard.vni'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.hkeyboard.vni"
        minSdk = 26
        targetSdk = 34
        versionCode = appVersionCode
        versionName = appVersionName

        buildConfigField 'String', 'GITHUB_REPO_OWNER', "\"${githubRepoParts[0]}\""
        buildConfigField 'String', 'GITHUB_REPO_NAME', "\"${githubRepoParts.length > 1 ? githubRepoParts[1] : 'HKeyboard'}\""
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile = rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword = keystoreProps.getProperty('storePassword')
                keyAlias = keystoreProps.getProperty('keyAlias')
                keyPassword = keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Ky bang keystore rieng neu co; neu khong thi dung chu ky debug.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // Cho phep unit test doc duoc cac hang so cua android.view.KeyEvent
            // (moi phuong thuc khac tra ve gia tri mac dinh).
            returnDefaultValues = true
        }
    }
}

// =====================================================================
// Dat ten APK release la Hkeyboard.apk.
// AGP 9 da bo API cu (applicationVariants / outputFileName), nen dung Variant
// API moi: bien doi artifact APK bang mot task chep APK sang file ten moi.
// AGP coi file chep ra la APK cuoi cung (assembleRelease tu chay task nay).
// =====================================================================
abstract class RenameApkTask extends DefaultTask {
    @InputFiles
    abstract DirectoryProperty getApkFolder()

    @OutputDirectory
    abstract DirectoryProperty getOutFolder()

    @Input
    abstract Property<String> getApkName()

    @Internal
    abstract Property<ArtifactTransformationRequest<RenameApkTask>> getTransformationRequest()

    @TaskAction
    void rename() {
        transformationRequest.get().submit(this) { builtArtifact ->
            def input = new File(builtArtifact.outputFile)
            def output = new File(outFolder.get().asFile, apkName.get())
            Files.copy(input.toPath(), output.toPath(), StandardCopyOption.REPLACE_EXISTING)
            output
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def renameTask = tasks.register("rename${variant.name.capitalize()}Apk", RenameApkTask) {
            apkName.set('Hkeyboard.apk')
        }
        def request = variant.artifacts.use(renameTask)
                .wiredWithDirectories({ it.apkFolder }, { it.outFolder })
                .toTransformMany(SingleArtifact.APK.INSTANCE)
        renameTask.configure { transformationRequest.set(request) }
    }
}

dependencies {
    // appcompat đã kéo theo androidx.core (chứa FileProvider) với phiên bản
    // tương thích, nên KHÔNG khai báo androidx.core riêng — sẽ gây trùng lớp
    // kotlin-stdlib.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    testImplementation 'junit:junit:4.13.2'
}

// In ra so hieu phien ban moi khi build release cho de doi chieu.
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doFirst {
        println "==> HKeyboard v${appVersionName} (versionCode ${appVersionCode})" +
                (hasReleaseKeystore ? " - ky bang keystore release" : " - CANH BAO: dung chu ky debug")
    }
}
